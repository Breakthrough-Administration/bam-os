<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="emeraldTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="cyanTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="goldSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="400" height="400" rx="80" fill="url(#bgGrad)" />
  <rect width="396" height="396" x="2" y="2" rx="78" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.25" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="190" r="110" fill="#0d9488" fill-opacity="0.12" filter="url(#softGlow)" />
  <circle cx="240" cy="160" r="70" fill="#06b6d4" fill-opacity="0.1" filter="url(#softGlow)" />

  <!-- Radiating Energy Rays (Breakthrough motif) -->
  <g stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-opacity="0.25">
    <line x1="200" y1="50" x2="200" y2="75" />
    <line x1="270" y1="80" x2="253" y2="98" />
    <line x1="320" y1="140" x2="298" y2="150" />
    <line x1="130" y1="80" x2="147" y2="98" />
    <line x1="80" y1="140" x2="102" y2="150" />
  </g>

  <!-- Left Intertwined Growth Wing (Soothing Emerald) -->
  <path d="M 120 280 C 100 210, 130 140, 195 105 C 190 145, 175 185, 145 220 C 130 240, 120 260, 120 280 Z" 
        fill="url(#emeraldTeal)" fill-opacity="0.85" />
  
  <!-- Right Intertwined Support Wing (Calming Cyan) -->
  <path d="M 280 280 C 300 210, 270 140, 205 105 C 210 145, 225 185, 255 220 C 270 240, 280 260, 280 280 Z" 
        fill="url(#cyanTeal)" fill-opacity="0.85" />

  <!-- Central Ascending Core (Clinical Breakthrough Star/Heart) -->
  <path d="M 200 90 Q 230 160 270 210 C 240 230, 210 240, 200 280 C 190 240, 160 230, 130 210 Q 170 160 200 90 Z" 
        fill="url(#emeraldTeal)" filter="url(#softGlow)" />

  <!-- Warm Golden Spark Center (Empowerment & Inclusion) -->
  <circle cx="200" cy="180" r="16" fill="url(#goldSun)" />
  <path d="M 200 155 L 204 176 L 225 180 L 204 184 L 200 205 L 196 184 L 175 180 L 196 176 Z" fill="#ffffff" />

  <!-- Base Cradle Foundation (Supportive Hands / Community Arc) -->
  <path d="M 110 270 C 160 325, 240 325, 290 270 C 270 305, 230 320, 200 320 C 170 320, 130 305, 110 270 Z" 
        fill="#14b8a6" fill-opacity="0.6" />

  <!-- Dynamic Swirling Ring -->
  <ellipse cx="200" cy="275" rx="110" ry="24" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="8 8" stroke-opacity="0.4" />
</svg>
